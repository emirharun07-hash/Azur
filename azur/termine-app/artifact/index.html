<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZUR Termine</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one plain list, next due on top. Three small months beside it (wide window),
     behind a switch (phone), and a tighter list in a small window (class "compact"). */
  --paper: #ffffff;
  --soft: #f2f4f5;
  --ink: #111214;
  --muted: #666b6f;
  --line: #e1e4e6;
  --accent: #0a6a9a;
  --accent-fill: #16b8ff;
  --on-accent: #07131d;
  --late: #c62828;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --narrow: 72%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --soft: #1f2123; --ink: #f1eee8; --muted: #a3a6a8; --line: #34373a;
    --accent: #8debff; --late: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --soft: #1f2123; --ink: #f1eee8; --muted: #a3a6a8; --line: #34373a;
  --accent: #8debff; --late: #ff8a80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--font); }
h1, h2, h3, p, ul, ol, fieldset { margin: 0; padding: 0; }
h2, h3 { text-wrap: balance; }
ul { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; border-radius: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
body:not(.desk) .only-desk, body:not(.can-share) .only-share, body:not(.can-export) .needs-export { display: none !important; }

.top__in, .bar, .wrap, .foot { max-width: 1120px; margin-inline: auto; padding-inline: 16px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top__in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.brand { display: flex; align-items: flex-end; gap: 8px; margin-right: auto; }
.brand svg { display: block; height: 32px; width: auto; }
.brand span { padding-bottom: 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.sync i { width: 8px; height: 8px; background: var(--muted); }
.sync[data-state="ok"] i { background: var(--accent-fill); }
.sync[data-state="stale"] i, .sync[data-state="off"] i { background: var(--late); }
.sync[data-state="load"] i { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* switches and buttons */
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg > * { position: relative; display: block; }
.seg > * + * { border-left: 1px solid var(--ink); }
.seg > button, .seg > label > span { display: block; min-height: 34px; padding: 7px 12px; font-size: 13px; font-weight: 600; line-height: 20px; text-align: center; white-space: nowrap; cursor: pointer; }
.seg > button[aria-pressed="true"], .seg > label > input:checked + span { background: var(--ink); color: var(--paper); }
.seg > label > input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg > label > input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg--full { display: flex; }
.seg--full > * { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn--primary { background: var(--ink); color: var(--paper); }
.btn--quiet { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; }
.link { padding: 6px 0; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link--late { color: var(--late); }

/* summary and filter */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 14px; }
.sum { margin-right: auto; font-size: 15px; color: var(--muted); }
.sum b { color: var(--ink); font-weight: 700; }
.sum .late { color: var(--late); font-weight: 700; }
.tick { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; font-size: 13px; font-weight: 600; cursor: pointer; }
.tick input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }

/* panes */
.wrap { padding-bottom: 24px; }
body[data-view="liste"] #pane-monate, body[data-view="monate"] #pane-liste { display: none; }

/* list */
.sec { padding-top: 22px; }
.sec__h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 7px; border-bottom: 1px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.sec__h span { color: var(--muted); font-variant-numeric: tabular-nums; }
.sec--late .sec__h { color: var(--late); border-color: var(--late); }
.sec--late .sec__h span { color: inherit; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: start; border-bottom: 1px solid var(--line); }
.check { display: grid; justify-items: start; align-items: start; width: 40px; min-height: 52px; padding-top: 14px; }
.check i { display: block; width: 22px; height: 22px; border: 1.5px solid var(--ink); }
.check[aria-pressed="true"] i { background: var(--ink); }
.check[aria-pressed="true"] i::after { content: ""; display: block; width: 7px; height: 12px; margin: 1.5px 0 0 6px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.check:disabled { opacity: .35; }
.row__main { display: grid; gap: 2px; width: 100%; min-width: 0; padding: 12px 0 13px; }
.row__title { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; hyphenate-limit-chars: 12 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
.row__meta { display: flex; flex-wrap: wrap; column-gap: 12px; font-size: 13px; color: var(--muted); }
.row__meta > span { white-space: nowrap; }
.row__meta .m { display: inline-block; margin-right: 5px; }
.row__note { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row__count { padding: 12px 0 0 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.1; }
.row__count b { display: block; font-size: 28px; font-weight: 700; font-stretch: var(--narrow); line-height: 1; }
.row__count span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row__count .chip { display: inline-block; padding: 3px 7px; }
.is-open .row__count .chip { color: var(--ink); }
.is-today .row__count .chip { background: var(--accent-fill); color: var(--on-accent); }
.is-late .row__count, .is-late .row__count span { color: var(--late); }
.is-done .row__title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.is-fresh { animation: fresh 1.8s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent-fill) 28%, transparent); } to { background: transparent; } }
@media (hover: hover) {
  .row__main:hover .row__title { text-decoration: underline; text-underline-offset: 3px; }
  .is-done .row__main:hover .row__title { text-decoration: line-through underline; }
  button.day:hover { background: var(--soft); }
}
.empty { padding: 28px 0; color: var(--muted); }
.notice { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--late); color: var(--late); font-size: 14px; }

/* months */
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 7px; border-bottom: 1px solid var(--ink); }
.mhead h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.pager { display: flex; gap: 4px; }
.pager button { min-width: 32px; min-height: 28px; padding: 0 8px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-align: center; }
.pager button:disabled { color: var(--muted); }
.months { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px 32px; padding-top: 16px; }
.month h3 { padding-bottom: 6px; font-size: 15px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wd { padding: 3px 0 5px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; }
.day { display: grid; grid-template-rows: 20px 8px; align-content: center; justify-items: center; gap: 2px; height: 40px; border-top: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; }
.day .n { display: block; min-width: 22px; line-height: 20px; }
.day.is-past .n { color: var(--muted); }
.day.has .n { font-weight: 700; }
.day.is-today .n { background: var(--accent-fill); color: var(--on-accent); font-weight: 700; }
.marks { display: flex; align-items: center; gap: 2px; height: 7px; }
.m { display: block; width: 7px; height: 7px; border: 1.5px solid var(--ink); }
.m.deadline { background: var(--ink); }
.m.late { border-color: var(--late); }
.m.deadline.late { background: var(--late); }
.m.done { border-color: var(--muted); }
.m.deadline.done { background: var(--muted); }
.more { font-size: 9px; font-style: normal; line-height: 7px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

.foot { display: flex; flex-wrap: wrap; gap: 4px 20px; padding-block: 12px 28px; border-top: 1px solid var(--line); }
body:not(.can-export):not(.can-share) .foot { display: none; }

/* dialogs */
dialog { width: min(520px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); overflow-y: auto; }
dialog::backdrop { background: rgb(7 19 29 / .5); }
.form { display: grid; gap: 14px; padding: 18px 16px 16px; }
.form h2 { font-size: 20px; font-weight: 700; line-height: 1.2; outline: none; }
.form > p { font-size: 15px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .field > legend, .cal__h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field > legend { padding: 0 0 5px; }
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field textarea { display: block; width: 100%; min-width: 0; min-height: 44px; padding: 9px 10px; border: 1px solid var(--ink); background: var(--paper); font-size: 16px; line-height: 24px; -webkit-appearance: none; appearance: none; }
.field input[readonly] { background: var(--soft); font-size: 13px; }
.field textarea { resize: vertical; }
.field input::-webkit-date-and-time-value { text-align: left; }
.form .seg > label > span { min-height: 44px; padding-block: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.inline { display: flex; gap: 8px; }
.inline > input { flex: 1; }
.cal { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cal__b { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; color: var(--late); }
.msg--info { color: var(--ink); }
.ok-line { display: flex; align-items: baseline; gap: 8px; }
.ok-line::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--accent-fill); }
.steps { display: grid; gap: 6px; padding-left: 20px; font-size: 14px; }
.more-box { border-top: 1px solid var(--line); padding-top: 10px; }
.more-box > summary { cursor: pointer; font-size: 14px; font-weight: 600; }
.more-box[open] > summary { margin-bottom: 10px; }
.more-box > div { display: grid; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; }
.grow { flex: 1; }
.confirm { font-size: 14px; }
@media (max-width: 560px) {
  dialog { width: 100%; max-width: 100%; max-height: 92%; margin: auto 0 0; border-width: 1px 0 0; }
}

.toast { position: fixed; left: 50%; bottom: 16px; z-index: 30; display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 24px); padding: 10px 14px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 14px; }
.toast button { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }

body.readonly .w { display: none; }

/* wide window: list and months side by side */
@media (min-width: 880px) {
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 0 48px; align-items: start; }
  body[data-view] #pane-liste, body[data-view] #pane-monate { display: block; }
  .tabs { display: none; }
  .mhead { padding-top: 22px; }
  .months { gap: 18px; }
  .day { grid-template-rows: 18px 7px; gap: 1px; height: 32px; }
  .day .n { line-height: 18px; }
  #pane-monate { position: sticky; top: 58px; max-height: calc(100vh - 58px); max-height: calc(100dvh - 58px); padding-bottom: 16px; overflow-y: auto; }
  body.compact #pane-monate { top: 44px; max-height: calc(100vh - 44px); }
}
@media (max-width: 480px) { .sync span { display: none; } }
@media (max-width: 420px) { .brand span { display: none; } }
@media (max-width: 340px) { .two { grid-template-columns: 1fr; } }

/* small window (or "Klein" in the desktop app): only the essentials */
body.compact .top__in { gap: 6px 8px; padding-block: 5px; }
body.compact .brand svg { height: 24px; }
body.compact .brand span, body.compact .sync span { display: none; }
body.compact .top .btn { min-height: 32px; padding: 0 10px; }
body.compact .seg > button { min-height: 30px; padding: 5px 9px; }
body.compact .bar { gap: 6px 12px; padding-top: 8px; }
body.compact .sum, body.compact .x-long { display: none; }
body.compact .tick { min-height: 28px; }
body.compact .sec { padding-top: 12px; }
body.compact .sec__h { padding-bottom: 4px; }
body.compact .row { grid-template-columns: 30px minmax(0, 1fr) auto; }
body.compact .check { width: 30px; min-height: 38px; padding-top: 9px; }
body.compact .check i { width: 18px; height: 18px; }
body.compact .check[aria-pressed="true"] i::after { width: 6px; height: 10px; margin: 1px 0 0 4.5px; }
body.compact .row__main { padding: 7px 0 8px; }
body.compact .row__title { font-size: 14px; }
body.compact .row__meta { font-size: 12px; }
body.compact .row__meta .x, body.compact .row__note { display: none; }
body.compact .row__count { padding-top: 8px; }
body.compact .row__count b { display: inline; font-size: 18px; }
body.compact .row__count span { margin-left: 3px; font-size: 10px; }
body.compact .mhead { padding-top: 10px; }
body.compact .day { height: 32px; }
body.compact .foot, body.compact .legend { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
/* AZUR Termine on claude.ai: entries live in the artifact's shared database (collection "termine"). */
window.TermineStore = function () {
  "use strict";
  function waitClaude() {
    return new Promise(done => {
      let n = 0;
      (function look() {
        const c = window.claude;
        if (c && typeof c.use === "function") done(c);
        else if (++n > 40) done(null);
        else setTimeout(look, 100);
      })();
    });
  }

  /* a .zip that holds one stored file: used when a bare .ics may not be saved here */
  const enc = new TextEncoder();
  function crc32(u) {
    let c = -1;
    for (let i = 0; i < u.length; i++) { c ^= u[i]; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; }
    return ~c >>> 0;
  }
  function zipOne(name, text) {
    const data = enc.encode(text), fn = enc.encode(name), crc = crc32(data), d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const out = new Uint8Array(30 + fn.length + data.length + 46 + fn.length + 22), v = new DataView(out.buffer);
    let p = 0;
    v.setUint32(p, 0x04034b50, true); v.setUint16(p + 4, 20, true); v.setUint16(p + 6, 0x0800, true);
    v.setUint16(p + 10, time, true); v.setUint16(p + 12, date, true); v.setUint32(p + 14, crc, true);
    v.setUint32(p + 18, data.length, true); v.setUint32(p + 22, data.length, true); v.setUint16(p + 26, fn.length, true);
    out.set(fn, p + 30); out.set(data, p + 30 + fn.length);
    p += 30 + fn.length + data.length;
    const cd = p;
    v.setUint32(p, 0x02014b50, true); v.setUint16(p + 4, 20, true); v.setUint16(p + 6, 20, true); v.setUint16(p + 8, 0x0800, true);
    v.setUint16(p + 12, time, true); v.setUint16(p + 14, date, true); v.setUint32(p + 16, crc, true);
    v.setUint32(p + 20, data.length, true); v.setUint32(p + 24, data.length, true); v.setUint16(p + 28, fn.length, true);
    v.setUint32(p + 42, 0, true);
    out.set(fn, p + 46);
    p += 46 + fn.length;
    v.setUint32(p, 0x06054b50, true); v.setUint16(p + 8, 1, true); v.setUint16(p + 10, 1, true);
    v.setUint32(p + 12, p - cd, true); v.setUint32(p + 16, cd, true);
    return out;
  }

  return waitClaude().then(claude => {
    if (!claude) return null;
    const use = name => { try { return Promise.resolve(claude.use(name)).catch(() => null); } catch (e) { return Promise.resolve(null); } };
    return Promise.all([use("db"), use("downloads"), use("user")]).then(([db, dl, user]) => {
      if (!db) return null;
      const col = db.collection("termine");
      let icsRefused = false;

      function saveCalendar(name, ics) {
        const asZip = () => dl.save({ filename: name + ".zip", data: zipOne(name + ".ics", ics) })
          .then(() => ({ msg: "Die Kalenderdatei steckt in einer ZIP-Datei. Öffne erst die ZIP, dann die Datei darin.", info: true }));
        const first = icsRefused ? asZip() : dl.save({ filename: name + ".ics", data: ics }).then(() => ({ msg: "" }), err => {
          if (!err || err.code !== "rejected_extension") throw err;
          icsRefused = true;
          return asZip();
        });
        return first.catch(err => {
          const code = err && err.code;
          if (code === "declined") return { msg: "" };
          if (code === "rate_limited") return { msg: "Bitte kurz warten und noch einmal versuchen." };
          return { msg: "Die Datei konnte hier nicht gespeichert werden." };
        });
      }

      function subscribe(next, status) {
        let staleT = 0, retries = 0, loaded = false;
        const arm = () => {
          if (!staleT) staleT = setTimeout(() => {
            staleT = 0;
            status({ state: "stale", label: "Nicht aktuell", note: loaded ? "Keine Verbindung. Der Stand kann alt sein." : "Die Daten sind noch nicht erreichbar. Die App versucht es weiter." });
          }, 10000);
        };
        const go = () => {
          arm();
          col.onSnapshot(snap => {
            const entries = [];
            for (const d of snap.docs) if (d.exists) entries.push({ id: d.id, data: d.data() });
            loaded = true; retries = 0;
            if (snap.metadata && snap.metadata.fromCache) arm();
            else { clearTimeout(staleT); staleT = 0; status({ state: "ok", label: "Aktuell" }); }
            next({ entries: entries });
          }, err => {
            clearTimeout(staleT); staleT = 0;
            if (err && err.code === "unavailable" && retries < 3) {
              status({ state: "stale", label: "Nicht aktuell", note: "Keine Verbindung. Der Stand kann alt sein." });
              setTimeout(go, [3000, 10000, 30000][retries++]);
            } else status({ state: "off", label: "Nicht verbunden", note: "Die Daten sind gerade nicht erreichbar. Bitte später noch einmal öffnen." });
          });
        };
        go();
      }

      return {
        kind: "claude",
        calendarLabel: "Kalenderdatei",
        canWrite: () => user ? user.can("data.write") : null,
        subscribe: subscribe,
        newId: () => col.doc().id,
        create: (id, data) => col.doc(id).set(data),
        update: (id, patch) => col.doc(id).update(patch),
        remove: id => col.doc(id).delete(),
        saveCalendar: dl ? saveCalendar : null
      };
    });
  });
};
</script>

  function put(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(k => put(el, k)); return; }
    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function h(tag, attrs) {
    const el = document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (let i = 2; i < arguments.length; i++) put(el, arguments[i]);
    return el;
  }

  /* ---------- dates (plain YYYY-MM-DD strings, weeks start on Monday) ---------- */
  const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const pad = n => String(n).padStart(2, "0");
  const ymd = (y, m, d) => y + "-" + pad(m) + "-" + pad(d);
  const parse = s => { const p = s.split("-").map(Number); return { y: p[0], m: p[1], d: p[2] }; };
  const utcMs = s => { const p = parse(s); return Date.UTC(p.y, p.m - 1, p.d); };
  const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
  const addDays = (s, n) => { const t = new Date(utcMs(s) + n * 864e5); return ymd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
  const diffDays = (a, b) => Math.round((utcMs(a) - utcMs(b)) / 864e5);
  const weekday = s => new Date(utcMs(s)).getUTCDay();
  const validDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s;
  const fmtDate = s => { const p = parse(s); return WD[weekday(s)] + ", " + pad(p.d) + "." + pad(p.m) + "." + p.y; };
  const fmtLong = s => { const p = parse(s); return WD_LONG[weekday(s)] + ", " + p.d + ". " + MON[p.m - 1] + " " + p.y; };
  const nowIso = () => new Date().toISOString();

  /* ---------- state ---------- */
  const WHO = { emir: "Emir", talha: "Talha", beide: "Beide" };
  const KIND = { termin: "Termin", deadline: "Deadline" };
  const state = {
    entries: [], loaded: false, noStore: false, readOnly: false, mini: false,
    status: { state: "load", label: "Lädt", note: "" },
    who: "alle", showDone: false, view: "liste", monthShift: 0, today: todayStr()
  };
  let store = null, editing = null, dayOpen = null, toastT = 0;
  let known = new Map();
  const flash = new Set(), mine = new Map(), chains = new Map();

  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem("azur-termine") || "{}");
      if (p.who === "emir" || p.who === "talha") state.who = p.who;
      state.showDone = p.showDone === true;
      if (p.view === "monate") state.view = "monate";
    } catch (e) { /* no storage: defaults */ }
  }
  function savePrefs() {
    try { localStorage.setItem("azur-termine", JSON.stringify({ who: state.who, showDone: state.showDone, view: state.view })); } catch (e) { /* ignore */ }
  }

  /* stored data is untrusted: keep only well-formed entries */
  function clean(id, d) {
    if (!d || typeof d !== "object" || !validDate(d.date)) return null;
    return {
      id: id,
      title: typeof d.title === "string" && d.title.trim() ? d.title.trim().slice(0, 200) : "Ohne Titel",
      date: d.date,
      time: typeof d.time === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(d.time) ? d.time : "",
      kind: d.kind === "deadline" ? "deadline" : "termin",
      who: d.who === "emir" || d.who === "talha" ? d.who : "beide",
      note: typeof d.note === "string" ? d.note.slice(0, 4000) : "",
      done: d.done === true
    };
  }
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.time < b.time ? -1 : a.time > b.time ? 1 : a.title.localeCompare(b.title, "de");
  const visible = () => state.entries.filter(e => state.who === "alle" || e.who === state.who || e.who === "beide");

  function countOf(e) {
    if (e.done) return { state: "done", num: "", unit: "erledigt", title: "Erledigt" };
    const n = diffDays(e.date, state.today);
    if (n < 0) return { state: "late", num: String(-n), unit: n === -1 ? "Tag" : "Tage", extra: " zu spät", title: "Seit " + (-n) + (n === -1 ? " Tag" : " Tagen") + " überfällig" };
    if (n === 0) return { state: "today", num: "", unit: "heute", title: "Heute" };
    if (n === 1) return { state: "open", num: "", unit: "morgen", title: "Morgen" };
    return { state: "open", num: String(n), unit: "Tage", title: "Noch " + n + " Tage" };
  }

  /* ---------- render ---------- */
  function render() {
    document.body.dataset.view = state.view;
    for (const b of document.querySelectorAll("#views button")) b.setAttribute("aria-pressed", String(b.dataset.view === state.view));
    for (const b of document.querySelectorAll("#who button")) b.setAttribute("aria-pressed", String(b.dataset.who === state.who));
    $("#show-done").checked = state.showDone;
    renderSync(); renderSum(); renderList(); renderMonths();
    if (dayOpen && $("#dlg-day").open) renderDay();
  }

  function renderSync() {
    const s = state.status, el = $("#sync");
    el.dataset.state = s.state; el.title = s.label; el.lastElementChild.textContent = s.label;
  }

  function renderSum() {
    const el = $("#sum");
    if (!state.loaded) { el.replaceChildren(); return; }
    const open = visible().filter(e => !e.done), late = open.filter(e => e.date < state.today).length;
    el.replaceChildren(h("b", null, String(open.length)), " offen");
    if (late) put(el, [" · ", h("span", { class: "late" }, late + " überfällig")]);
  }

  function rowEl(e) {
    const c = countOf(e);
    return h("li", { class: "row is-" + c.state + (flash.has(e.id) ? " is-fresh" : "") },
      h("button", { class: "check", type: "button", disabled: state.readOnly, "aria-pressed": String(e.done), "aria-label": (e.done ? "Wieder öffnen: " : "Abhaken: ") + e.title, onclick: () => toggle(e) }, h("i")),
      h("button", { class: "row__main", type: "button", onclick: () => openEntry(e) },
        h("span", { class: "row__title" }, e.title),
        h("span", { class: "row__meta" },
          h("span", null, fmtDate(e.date) + (e.time ? " · " + e.time + " Uhr" : "")),
          h("span", { class: "x" }, h("i", { class: "m " + e.kind }), KIND[e.kind]),
          h("span", { class: "x" }, WHO[e.who])),
        e.note ? h("span", { class: "row__note" }, e.note) : null),
      h("span", { class: "row__count", title: c.title }, c.num ? h("b", null, c.num) : null,
        h("span", { class: c.num ? null : "chip" }, c.unit, c.extra ? h("span", { class: "x-long" }, c.extra) : null)));
  }

  function secEl(s) {
    return h("section", { class: "sec" + (s.tone ? " sec--" + s.tone : "") },
      h("h2", { class: "sec__h" }, s.title, h("span", null, String(s.items.length))),
      h("ul", null, s.items.map(rowEl)));
  }

  function renderList() {
    const box = $("#list"), notice = $("#notice"), st = state.status.state;
    let note = "";
    if (state.noStore) note = "Hier gibt es keine Verbindung zu den Daten. Öffne die Seite in Claude und melde dich an.";
    else if (state.status.note) note = state.status.note;
    else if (state.readOnly) note = "Du kannst hier nur lesen, nichts ändern.";
    notice.hidden = !note; notice.textContent = note;
    if (!state.loaded) { box.replaceChildren(state.noStore || st === "stale" || st === "off" ? "" : h("p", { class: "empty" }, "Lädt …")); return; }

    const today = state.today, all = visible(), open = all.filter(e => !e.done).sort(byDate), lim = addDays(today, 7), secs = [];
    const late = open.filter(e => e.date < today), now = open.filter(e => e.date === today);
    const week = open.filter(e => e.date > today && e.date <= lim);
    if (late.length) secs.push({ title: "Überfällig", tone: "late", items: late });
    if (now.length) secs.push({ title: "Heute", items: now });
    if (week.length) secs.push({ title: "Nächste 7 Tage", items: week });
    let cur = null;
    for (const e of open) {
      if (e.date <= lim) continue;
      const key = e.date.slice(0, 7);
      if (!cur || cur.key !== key) { const p = parse(e.date); cur = { key: key, title: MON[p.m - 1] + " " + p.y, items: [] }; secs.push(cur); }
      cur.items.push(e);
    }
    if (state.showDone) {
      const done = all.filter(e => e.done).sort((a, b) => byDate(b, a));
      if (done.length) secs.push({ title: "Erledigt", items: done });
    }
    if (secs.length) { box.replaceChildren.apply(box, secs.map(secEl)); return; }
    const name = state.who === "alle" ? "" : " für " + WHO[state.who];
    const text = !state.entries.length ? "Noch keine Einträge. Mit „+ Neu“ legst du den ersten an."
      : all.length ? "Alles erledigt" + name + "." : "Keine Einträge" + name + ".";
    box.replaceChildren(h("p", { class: "empty" }, text));
  }

  function dayMap() {
    const map = new Map();
    for (const e of visible()) { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); }
    return map;
  }

  function monthEl(y, m, map) {
    const first = ymd(y, m, 1), lead = (weekday(first) + 6) % 7, days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const grid = h("div", { class: "grid" }, ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(w => h("span", { class: "wd", "aria-hidden": "true" }, w)));
    for (let i = 0; i < lead; i++) put(grid, h("span", { class: "day" }));
    for (let d = 1; d <= days; d++) {
      const date = ymd(y, m, d);
      const list = (map.get(date) || []).filter(e => state.showDone || !e.done).sort(byDate);
      const cls = "day" + (date === state.today ? " is-today" : date < state.today ? " is-past" : "") + (list.length ? " has" : "");
      put(grid, h("button", {
        class: cls, type: "button",
        "aria-label": fmtLong(date) + (list.length ? ", " + list.length + (list.length === 1 ? " Eintrag" : " Einträge") : ""),
        title: list.map(e => e.title).join("\n") || null,
        onclick: () => openDay(date)
      },
        h("span", { class: "n" }, String(d)),
        h("span", { class: "marks" },
          list.slice(0, 3).map(e => h("i", { class: "m " + e.kind + (e.done ? " done" : e.date < state.today ? " late" : "") })),
          list.length > 3 ? h("i", { class: "more" }, "+") : null)));
    }
    for (let i = (7 - (lead + days) % 7) % 7; i > 0; i--) put(grid, h("span", { class: "day" }));
    return h("section", { class: "month" }, h("h3", null, MON[m - 1] + " " + y), grid);
  }

  function renderMonths() {
    const t = parse(state.today), map = dayMap(), out = [];
    for (let i = 0; i < 3; i++) {
      const idx = t.y * 12 + (t.m - 1) + state.monthShift + i;
      out.push(monthEl(Math.floor(idx / 12), idx % 12 + 1, map));
    }
    const box = $("#months");
    box.replaceChildren.apply(box, out);
    $("#m-today").disabled = state.monthShift === 0;
  }

  /* ---------- day dialog: everything due that day ---------- */
  const dayEntries = date => visible().filter(e => e.date === date).sort(byDate);
  function renderDay() {
    const list = dayEntries(dayOpen);
    $("#day-h").textContent = fmtLong(dayOpen);
    $("#day-list").replaceChildren(list.length ? h("ul", null, list.map(rowEl)) : h("p", { class: "empty" }, "An diesem Tag ist nichts fällig."));
  }
  function openDay(date) { dayOpen = date; renderDay(); $("#dlg-day").showModal(); $("#day-h").focus(); }

  /* ---------- entry dialog ---------- */
  const form = $("#entry-form"), fTitle = $("#f-title"), fDate = $("#f-date"), fTime = $("#f-time"), fNote = $("#f-note");
  function setMsg(t, info) { const m = $("#entry-msg"); m.textContent = t; m.hidden = !t; m.classList.toggle("msg--info", !!info); }
  function syncTimeClear() { $("#time-clear").hidden = !fTime.value; }

  function openEntry(e) {
    if ($("#dlg-day").open) $("#dlg-day").close();
    editing = e && e.id ? e : null;
    form.reset();
    $("#entry-h").textContent = editing ? "Eintrag ändern" : "Neuer Eintrag";
    fTitle.value = editing ? e.title : "";
    fDate.value = (e && e.date) || state.today;
    fTime.value = editing ? e.time : "";
    form.elements.kind.value = editing ? e.kind : "termin";
    form.elements.who.value = editing ? e.who : state.who === "alle" ? "beide" : state.who;
    fNote.value = editing ? e.note : "";
    $("#cal-box").hidden = !editing;
    $("#del").hidden = !editing;
    $("#del-confirm").hidden = true;
    setMsg(""); syncTimeClear(); busy(false); syncCalLink();
    $("#dlg-entry").showModal();
    (editing ? $("#entry-h") : fTitle).focus();
  }

  function readForm(quiet) {
    const title = fTitle.value.trim();
    if (!title) { if (!quiet) { fTitle.value = ""; fTitle.reportValidity(); } return null; }
    if (!validDate(fDate.value)) { if (!quiet) setMsg("Bitte ein Datum wählen."); return null; }
    return {
      title: title.slice(0, 140),
      date: fDate.value,
      time: /^\d\d:\d\d/.test(fTime.value) ? fTime.value.slice(0, 5) : "",
      kind: form.elements.kind.value === "deadline" ? "deadline" : "termin",
      who: form.elements.who.value === "emir" || form.elements.who.value === "talha" ? form.elements.who.value : "beide",
      note: fNote.value.trim()
    };
  }
  function busy(on) { $("#save").disabled = on; $("#save").textContent = on ? "Speichert …" : "Speichern"; }

  /* one write at a time per entry; one retry when the store is briefly away */
  function write(id, fn) {
    mine.set(id, Date.now());
    const run = () => fn().catch(err => {
      if (!err || err.code !== "unavailable") throw err;
      return new Promise(r => setTimeout(r, 500 + Math.random() * 900)).then(fn);
    });
    const next = (chains.get(id) || Promise.resolve()).then(run, run);
    chains.set(id, next.catch(() => {}));
    return next.then(() => { mine.set(id, Date.now()); });
  }
  const isMine = id => (mine.get(id) || 0) > Date.now() - 8000;

  form.addEventListener("submit", ev => {
    ev.preventDefault();
    if (!store || state.readOnly) return;
    const v = readForm(false);
    if (!v) return;
    setMsg(""); busy(true);
    let job;
    if (editing) {
      const id = editing.id;
      job = write(id, () => store.update(id, Object.assign({}, v, { updatedAt: nowIso() })));
    } else {
      const id = store.newId(), t = nowIso();
      job = write(id, () => store.create(id, Object.assign({}, v, { done: false, doneAt: null, createdAt: t, updatedAt: t })));
    }
    job.then(() => { $("#dlg-entry").close(); }, () => {
      setMsg(editing ? "Speichern hat nicht geklappt. Vielleicht wurde der Eintrag gerade gelöscht. Bitte noch einmal versuchen." : "Speichern hat nicht geklappt. Bitte noch einmal versuchen.");
    }).then(() => busy(false));
  });

  function toggle(e) {
    if (!store || state.readOnly) return;
    const done = !e.done;
    write(e.id, () => store.update(e.id, { done: done, doneAt: done ? nowIso() : null, updatedAt: nowIso() })).then(() => {
      if (done) toast("Erledigt: " + e.title, "Rückgängig", () => toggle(Object.assign({}, e, { done: true })));
      else hideToast();
    }, () => toast("Das hat nicht geklappt. Bitte noch einmal versuchen."));
  }

  $("#del").addEventListener("click", () => { $("#del").hidden = true; $("#del-confirm").hidden = false; $("#del-no").focus(); });
  $("#del-no").addEventListener("click", () => { $("#del-confirm").hidden = true; $("#del").hidden = false; });
  $("#del-yes").addEventListener("click", () => {
    if (!store || !editing) return;
    const id = editing.id;
    write(id, () => store.remove(id)).then(() => { $("#dlg-entry").close(); toast("Eintrag gelöscht."); },
      () => setMsg("Löschen hat nicht geklappt. Bitte noch einmal versuchen."));
  });

  /* ---------- calendar: Google link and .ics file ---------- */
  const enc = new TextEncoder();
  const stampUtc = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
  function span(e) {
    if (e.time) {
      const p = parse(e.date), t = e.time.split(":").map(Number), s = new Date(p.y, p.m - 1, p.d, t[0], t[1], 0);
      return { allDay: false, a: stampUtc(s), b: stampUtc(new Date(s.getTime() + 36e5)) };
    }
    return { allDay: true, a: e.date.replace(/-/g, ""), b: addDays(e.date, 1).replace(/-/g, "") };
  }
  const calSummary = e => (e.kind === "deadline" ? "Deadline: " : "") + e.title;
  const calDetails = e => [e.note, "Zuständig: " + WHO[e.who], "Aus AZUR Termine"].filter(Boolean).join("\n");
  function googleUrl(e) {
    const s = span(e), q = new URLSearchParams({ action: "TEMPLATE", text: calSummary(e), details: calDetails(e), dates: s.a + "/" + s.b });
    return "https://calendar.google.com/calendar/render?" + q.toString();
  }
  const icsText = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r\n|\r|\n/g, "\\n");
  function fold(line) {
    let out = "", cur = "", n = 0, lim = 75;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (n + b > lim) { out += cur + "\r\n "; cur = ""; n = 0; lim = 74; }
      cur += ch; n += b;
    }
    return out + cur;
  }
  /* reminders: the day before and on the day (all-day: 9:00 both days; with a time: 1 day and 1 hour before) */
  function icsFile(list) {
    const now = stampUtc(new Date()), L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AZUR//Termine//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
    for (const e of list) {
      const s = span(e), sum = icsText(calSummary(e));
      L.push("BEGIN:VEVENT", "UID:" + e.id + "@azur-termine", "DTSTAMP:" + now);
      if (s.allDay) L.push("DTSTART;VALUE=DATE:" + s.a, "DTEND;VALUE=DATE:" + s.b); else L.push("DTSTART:" + s.a, "DTEND:" + s.b);
      L.push("SUMMARY:" + sum, "DESCRIPTION:" + icsText(calDetails(e)));
      for (const t of s.allDay ? ["-PT15H", "PT9H"] : ["-P1D", "-PT1H"]) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + sum, "TRIGGER:" + t, "END:VALARM");
      L.push("END:VEVENT");
    }
    L.push("END:VCALENDAR");
    return L.map(fold).join("\r\n") + "\r\n";
  }
  function saveCalendar(name, list, say) {
    if (!store || !store.saveCalendar) return;
    Promise.resolve(store.saveCalendar(name, icsFile(list))).then(r => say((r && r.msg) || "", r && r.info), () => say("Die Datei konnte hier nicht gespeichert werden."));
  }
  function calEntry() { return editing ? Object.assign({}, editing, readForm(true) || {}) : null; }
  function syncCalLink() { const e = calEntry(); if (e) $("#cal-google").href = googleUrl(e); }
  form.addEventListener("input", () => { syncTimeClear(); syncCalLink(); });
  form.addEventListener("change", () => { syncTimeClear(); syncCalLink(); });
  $("#time-clear").addEventListener("click", () => { fTime.value = ""; syncTimeClear(); syncCalLink(); });
  $("#cal-file").addEventListener("click", () => { const e = calEntry(); if (e) saveCalendar("azur-termin-" + e.date, [e], setMsg); });
  $("#export-all").addEventListener("click", () => {
    const open = state.entries.filter(e => !e.done).sort(byDate);
    if (!open.length) { toast("Es gibt keine offenen Einträge."); return; }
    saveCalendar("azur-termine", open, t => { if (t) toast(t); });
  });

  /* ---------- toast ---------- */
  function hideToast() { clearTimeout(toastT); $("#toast").hidden = true; }
  function toast(text, label, fn) {
    clearTimeout(toastT);
    $("#toast-text").textContent = text;
    const b = $("#toast-act");
    b.hidden = !label; b.textContent = label || "";
    b.onclick = label ? () => { hideToast(); fn(); } : null;
    $("#toast").hidden = false;
    toastT = setTimeout(hideToast, 7000);
  }

  /* ---------- small window ---------- */
  const smallQuery = window.matchMedia("(max-height: 500px), (max-width: 340px)");
  function syncCompact() {
    document.body.classList.toggle("compact", smallQuery.matches || state.mini);
    const b = $("#mini");
    b.textContent = state.mini ? "Groß" : "Klein";
    b.title = state.mini ? "Wieder großes Fenster" : "Kleines Fenster, bleibt vor allen anderen";
  }
  if (smallQuery.addEventListener) smallQuery.addEventListener("change", syncCompact);

  /* ---------- wiring ---------- */
  function wire() {
    $("#views").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { state.view = b.dataset.view; savePrefs(); render(); } });
    $("#who").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { state.who = b.dataset.who; savePrefs(); render(); } });
    $("#show-done").addEventListener("change", ev => { state.showDone = ev.target.checked; savePrefs(); render(); });
    $("#add").addEventListener("click", () => openEntry(null));
    $("#m-prev").addEventListener("click", () => { state.monthShift--; renderMonths(); });
    $("#m-next").addEventListener("click", () => { state.monthShift++; renderMonths(); });
    $("#m-today").addEventListener("click", () => { state.monthShift = 0; renderMonths(); });
    $("#cancel").addEventListener("click", () => $("#dlg-entry").close());
    $("#day-close").addEventListener("click", () => $("#dlg-day").close());
    $("#day-add").addEventListener("click", () => openEntry({ date: dayOpen }));
    $("#mini").addEventListener("click", () => {
      if (!store || !store.setMini) return;
      Promise.resolve(store.setMini(!state.mini)).then(v => { state.mini = !!v; syncCompact(); }, () => {});
    });
    $("#open-share").addEventListener("click", () => {
      if (!store || !store.shareUI) return;
      const dlg = $("#dlg-share"), box = $("#share-box");
      box.replaceChildren();
      store.shareUI(box, () => dlg.close());
      dlg.showModal();
      const head = box.querySelector("h2"); if (head) { head.tabIndex = -1; head.focus(); }
    });
    for (const d of document.querySelectorAll("dialog")) d.addEventListener("click", ev => { if (ev.target === d) d.close(); });
    const tick = () => { const t = todayStr(); if (t !== state.today) { state.today = t; render(); } };
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", tick);
  }

  /* ---------- data ---------- */
  function onData(snap) {
    const list = [], next = new Map();
    for (const d of snap.entries || []) {
      const e = clean(d.id, d.data);
      if (!e) continue;
      list.push(e);
      const key = JSON.stringify(e);
      next.set(e.id, key);
      if (state.loaded && known.get(e.id) !== key && !isMine(e.id)) flash.add(e.id);
    }
    known = next;
    state.entries = list; state.loaded = true;
    render();
    flash.clear();
  }
  function onStatus(s) { state.status = Object.assign({ note: "" }, s); render(); }

  function connect(st) {
    if (!st) { state.noStore = true; state.status = { state: "off", label: "Nicht verbunden", note: "" }; render(); return; }
    store = st;
    const cls = document.body.classList;
    cls.toggle("desk", !!st.desktop);
    cls.toggle("can-export", !!st.saveCalendar);
    cls.toggle("can-share", !!st.shareUI);
    if (st.calendarLabel) $("#cal-file").textContent = st.calendarLabel;
    if (st.calendarHint) $("#cal-hint").textContent = st.calendarHint;
    if (st.getMini) Promise.resolve(st.getMini()).then(v => { state.mini = !!v; syncCompact(); }, () => {});
    if (st.onMini) st.onMini(v => { state.mini = !!v; syncCompact(); });
    Promise.resolve(st.canWrite ? st.canWrite() : true).then(ok => {
      if (ok === false) { state.readOnly = true; cls.add("readonly"); render(); }
    }, () => {});
    st.subscribe(onData, onStatus);
  }

  function start(saved) {
    loadPrefs();
    if (saved && typeof saved === "object") {
      if (saved.view === "liste" || saved.view === "monate") state.view = saved.view;
      if (saved.who === "alle" || saved.who === "emir" || saved.who === "talha") state.who = saved.who;
      if (typeof saved.showDone === "boolean") state.showDone = saved.showDone;
      if (Number.isInteger(saved.monthShift)) state.monthShift = saved.monthShift;
    }
    wire(); syncCompact(); render();
    let made;
    try { made = typeof window.TermineStore === "function" ? window.TermineStore() : null; } catch (e) { made = null; }
    Promise.resolve(made).then(connect, () => connect(null));
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ view: state.view, who: state.who, showDone: state.showDone, monthShift: state.monthShift }));
  if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
