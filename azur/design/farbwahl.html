<title>AZUR Farbwahl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: one swipe card in the middle (a miniature of the shop in that palette), buttons under it, an overview at the end.
   The page chrome stays neutral so it does not colour the choice. */
:root {
  --bg: #f2f1ee; --fg: #18191a; --mut: #5f6064; --line: #d9d8d3; --card: #ffffff; --yes: #1d7a46; --no: #b3261e;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141516; --fg: #eeeeec; --mut: #a3a4a7; --line: #2c2d30; --card: #1d1e20; --yes: #5fd08c; --no: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141516; --fg: #eeeeec; --mut: #a3a4a7; --line: #2c2d30; --card: #1d1e20; --yes: #5fd08c; --no: #ff8a80; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 46rem; margin: 0 auto; padding-block: 20px 40px; display: grid; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.top h1 { margin: 0; font-size: 26px; font-stretch: 62%; font-weight: 850; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.top p { margin: 0; color: var(--mut); font-size: 14px; }
.count { font-size: 12px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-variant-numeric: tabular-nums; }
.note { margin: 0; padding: 10px 12px; border: 1px solid var(--line); font-size: 13px; color: var(--mut); }

/* the deck */
.deck { position: relative; height: min(70vh, 640px); min-height: 460px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.sw { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / .12);
  cursor: grab; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; will-change: transform; overflow: hidden; }
.sw.is-drag { transition: none; cursor: grabbing; }
.sw.is-back { transform: scale(.95) translateY(14px); filter: brightness(.97); }
.sw__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sw__name { margin: 0; font-size: 20px; font-stretch: 70%; font-weight: 800; text-transform: uppercase; }
.sw__idea { margin: 2px 0 0; font-size: 13px; color: var(--mut); }
.sw__n { font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stamp { position: absolute; top: 70px; padding: 6px 12px; border: 3px solid; font-size: 22px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; opacity: 0; pointer-events: none; z-index: 3; }
.stamp--yes { left: 18px; color: var(--yes); rotate: -10deg; }
.stamp--no { right: 18px; color: var(--no); rotate: 10deg; }

/* the miniature shop, drawn only from the palette's own tokens (--p-*) */
.mini { min-height: 0; display: grid; grid-template-rows: auto auto 1fr auto; background: var(--p-paper); color: var(--p-ink); font-family: var(--sans); }
.mini__bar { padding: 5px 12px; background: var(--p-surface); border-bottom: 1px solid var(--p-line); color: var(--p-acc-text); font-size: 9.5px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; text-align: center; }
.mini__head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--p-line); font-size: 11.5px; }
.mini__head nav { display: flex; gap: 10px; }
.mini__logo { height: 18px; width: auto; }
.mini__bag { justify-self: end; display: flex; align-items: center; gap: 5px; }
.mini__bag svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.mini__body { min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, 1fr); gap: 16px; padding: 16px; align-items: center; }
.mini__kicker { margin: 0 0 6px; font-size: 10px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--p-text); }
.mini__title { margin: 0; font-size: clamp(26px, 6vw, 44px); font-stretch: 62%; font-weight: 900; line-height: .9; text-transform: uppercase; text-wrap: balance; }
.mini__lead { margin: 10px 0 14px; font-size: 13px; line-height: 1.45; color: var(--p-text); }
.mini__btn { display: inline-block; padding: 11px 14px; background: var(--p-acc); color: var(--p-acc-ink); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.mini__btn2 { display: inline-block; margin-left: 6px; padding: 10px 13px; border: 1px solid var(--p-ink); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.mini__cell { display: grid; place-items: center; padding: 14px 10px; background: var(--p-plate); border: 1px solid var(--p-line); min-height: 0; height: 100%; }
/* the player card (same gold/silver card as in the shop) */
.pc { width: min(100%, 168px); aspect-ratio: 5 / 8; display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; padding: 11% 9% 13%; text-align: center;
  background: linear-gradient(160deg, #e9d9a8, #b8954a); color: #2a2010; clip-path: polygon(50% 0, 100% 6%, 100% 94%, 50% 100%, 0 94%, 0 6%); }
.pc--land { background: linear-gradient(160deg, #eceef2, #9aa1ad); }
.pc__top { width: 100%; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 900; font-stretch: 70%; }
.pc__top small { font-size: 7px; letter-spacing: .1em; font-weight: 700; }
.pc img { width: 92%; height: 100%; object-fit: contain; min-height: 0; }
.pc__name { font-size: 12px; font-weight: 850; font-stretch: 70%; text-transform: uppercase; }
.pc__price { font-size: 10px; font-weight: 650; }
.mini__swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--p-line); }
.sws { display: grid; gap: 2px; padding: 8px 10px; font-size: 10px; color: var(--p-text); min-width: 0; }
.sws i { display: block; height: 16px; border: 1px solid var(--p-line); }
.sws b { color: var(--p-ink); font-weight: 650; }
.sws code { font-size: 9.5px; font-variant-numeric: tabular-nums; }

/* controls */
.ctrl { display: flex; justify-content: center; align-items: center; gap: 14px; }
.ctrl button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.round { width: 62px; height: 62px; border-radius: 50%; font-size: 24px; display: grid; place-items: center; }
.round--no { color: var(--no); border-color: currentColor !important; }
.round--yes { color: var(--yes); border-color: currentColor !important; }
.undo { height: 40px; padding: 0 14px; font-size: 12px !important; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
.ctrl button:disabled { opacity: .4; cursor: default; }
.ctrl button:focus-visible, .sw:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.help { margin: 0; text-align: center; font-size: 12.5px; color: var(--mut); }

/* overview */
.done { display: grid; gap: 16px; }
.done h2 { margin: 6px 0 0; font-size: 18px; font-stretch: 70%; font-weight: 800; text-transform: uppercase; }
.done p { margin: 0; color: var(--mut); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tile { border: 1px solid var(--line); background: var(--card); display: grid; }
.tile .mini { height: 300px; }
.tile .mini__body { grid-template-columns: 1fr 110px; gap: 10px; padding: 12px; }
.tile .mini__title { font-size: 26px; }
.tile .mini__lead { display: none; }
.tile .mini__head nav span:nth-child(n+2) { display: none; }
.tile__name { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 10px 12px; border-top: 1px solid var(--line); font-weight: 750; }
.tile__name small { color: var(--mut); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--line); font-size: 12.5px; }
.chip i { width: 12px; height: 12px; border: 1px solid var(--line); }
.again { justify-self: start; font: inherit; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; padding: 11px 14px; cursor: pointer; background: var(--fg); color: var(--bg); border: 0; }

@media (max-width: 560px) {
  .mini__body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 12px; }
  .mini__lead { display: none; }
  .mini__cell { padding: 8px; }
  .pc { width: auto; height: 100%; max-height: 210px; }
  .mini__head nav span:nth-child(n+2) { display: none; }
  .mini__btn2 { display: none; }
  .tile .mini__body { grid-template-columns: 1fr 100px; grid-template-rows: none; }
}
@media (prefers-reduced-motion: reduce) { .sw { transition: none; } }
</style>

<main class="page">
  <header class="top">
    <h1>Neue Grundfarbe</h1>
    <span class="count" id="count"></span>
    <p>Nach rechts wischen = gefällt, nach links = weg. Jede Karte zeigt den Shop im Kleinen: Hintergrund, Schrift, Kaufknopf und eine Trikotkarte.</p>
  </header>
  <p class="note" id="note" hidden></p>
  <section id="play">
    <div class="deck" id="deck" aria-live="polite"></div>
  </section>
  <div class="ctrl" id="ctrl">
    <button class="round round--no" id="no" type="button" aria-label="Verwerfen">✕</button>
    <button class="undo" id="undo" type="button">Zurück</button>
    <button class="round round--yes" id="yes" type="button" aria-label="Gefällt mir">♥</button>
  </div>
  <p class="help" id="help">Auch mit den Pfeiltasten: ← verwerfen, → gefällt.</p>
  <section class="done" id="done" hidden></section>
</main>

<script>
/* Eight neutral base colours for AZUR (instead of the dark green). Each is a complete set of the theme's tokens. */
const PALETTES = [
  { id: 'anthrazit', name: 'Anthrazit & Kreide', idea: 'Dunkles Anthrazit, Schrift und Kaufknopf in Kreideweiß. Ganz ohne Buntfarbe.', dark: true,
    paper: '#1c1d1f', surface: '#242628', plate: '#2c2e31', ink: '#f1eee8', line: '#35383b', text: '#a9aaa9', acc: '#ece5d6', accInk: '#1c1d1f' },
  { id: 'neon', name: 'Anthrazit & Neon', idea: 'Gleiches Anthrazit, der Kaufknopf bleibt Neongrün wie jetzt.', dark: true,
    paper: '#1c1d1f', surface: '#242628', plate: '#2c2e31', ink: '#f1eee8', line: '#35383b', text: '#a9aaa9', acc: '#39ff88', accInk: '#062b14' },
  { id: 'warmgrau', name: 'Warmgrau & Sand', idea: 'Dunkles, warmes Grau mit sandfarbenem Kaufknopf.', dark: true,
    paper: '#2a2724', surface: '#33302c', plate: '#3c3833', ink: '#f3eee6', line: '#45403a', text: '#b6ad9f', acc: '#dcc7a1', accInk: '#2a2724' },
  { id: 'graphit', name: 'Graphit & Rasengrün', idea: 'Kühles Graphit, ein leises Rasengrün nur am Kaufknopf.', dark: true,
    paper: '#202322', surface: '#282c2a', plate: '#303533', ink: '#eef1ee', line: '#383d3b', text: '#a5aca8', acc: '#7fd49a', accInk: '#0f2a19' },
  { id: 'offwhite', name: 'Off-White', idea: 'Helles Off-White, schwarze Schrift und schwarzer Kaufknopf.', dark: false,
    paper: '#f4f2ed', surface: '#ebe8e1', plate: '#e4e0d7', ink: '#1a1917', line: '#d8d3c8', text: '#5d5a53', acc: '#1a1917', accInk: '#f4f2ed' },
  { id: 'creme', name: 'Creme & Rasengrün', idea: 'Warmes Creme, dunkelgrüner Kaufknopf wie ein Vereinstrikot.', dark: false,
    paper: '#f1ece2', surface: '#e8e2d5', plate: '#dfd8c9', ink: '#16201a', line: '#d3cbbb', text: '#5a5b50', acc: '#1f5a37', accInk: '#f1ece2' },
  { id: 'sand', name: 'Gedecktes Sand', idea: 'Sand wie ein Trainingsplatz im Sommer, dunkelbraune Schrift.', dark: false,
    paper: '#e3d8c5', surface: '#d9ccb6', plate: '#cfc0a7', ink: '#27221c', line: '#c6b79e', text: '#5c5244', acc: '#27221c', accInk: '#e3d8c5' },
  { id: 'asche', name: 'Ascheplatz', idea: 'Helles Steingrau, Kaufknopf in Ziegelrot wie ein Ascheplatz.', dark: false,
    paper: '#dedad3', surface: '#d3cec5', plate: '#c8c2b8', ink: '#232120', line: '#bfb8ad', text: '#57524b', acc: '#9c3d24', accInk: '#f5efe6' }
];
const JERSEYS = [
  { img: 'img/frankfurt.webp', code: '069', kind: 'Stadt', name: 'Frankfurt 069', price: '64,99 €' },
  { img: 'img/tuerkei.webp', code: 'TUR', kind: 'Land', name: 'Türkei', price: '54,99 €' },
  { img: 'img/berlin.webp', code: '030', kind: 'Stadt', name: 'Berlin 030', price: '64,99 €' },
  { img: 'img/brasilien.webp', code: 'BRA', kind: 'Land', name: 'Brasilien', price: '54,99 €' }
];
const KEY = 'farbwahl';
const $ = s => document.querySelector(s);
const state = { votes: {}, history: [], db: null, uid: null };

function vars(p) {
  return `--p-paper:${p.paper};--p-surface:${p.surface};--p-plate:${p.plate};--p-ink:${p.ink};--p-line:${p.line};--p-text:${p.text};--p-acc:${p.acc};--p-acc-ink:${p.accInk};--p-acc-text:${p.acc}`;
}
function mini(p, i) {
  const j = JERSEYS[i % JERSEYS.length];
  const sw = [['Hintergrund', p.paper], ['Fläche', p.surface], ['Schrift', p.ink], ['Kaufknopf', p.acc]];
  return `<div class="mini" style="${vars(p)}">
    <div class="mini__bar">14 Tage kostenlose Rückgabe · Versand ab 90 € kostenlos</div>
    <div class="mini__head"><nav><span>Berlin 030</span><span>Frankfurt 069</span><span>Shop</span></nav>
      <img class="mini__logo" src="img/azur-logo-${p.dark ? 'paper' : 'ink'}.webp" alt="AZUR">
      <span class="mini__bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v13H4z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg>1</span></div>
    <div class="mini__body">
      <div><p class="mini__kicker">Die Kollektion</p><h3 class="mini__title">Sammel deine Stadt</h3>
        <p class="mini__lead">Trikots aus Berlin, Frankfurt und für drei Nationen. Größen S bis XL.</p>
        <span class="mini__btn">In den Warenkorb</span><span class="mini__btn2">Details</span></div>
      <div class="mini__cell"><div class="pc${j.kind === 'Land' ? ' pc--land' : ''}"><span class="pc__top">${j.code}<small>${j.kind.toUpperCase()}</small></span>
        <img src="${j.img}" alt="" draggable="false"><span class="pc__name">${j.name}</span><span class="pc__price">${j.price}</span></div></div>
    </div>
    <div class="mini__swatches">${sw.map(([n, c]) => `<span class="sws"><i style="background:${c}"></i><b>${n}</b><code>${c}</code></span>`).join('')}</div>
  </div>`;
}

function next() { return PALETTES.findIndex(p => state.votes[p.id] === undefined); }
function render() {
  const i = next(), deck = $('#deck');
  const seen = PALETTES.filter(p => state.votes[p.id] !== undefined).length;
  $('#count').textContent = i < 0 ? 'Fertig' : `${seen + 1} von ${PALETTES.length}`;
  $('#undo').disabled = !state.history.length;
  if (i < 0) { $('#play').hidden = true; $('#help').hidden = true; $('#no').hidden = true; $('#yes').hidden = true; renderDone(); return; }
  $('#play').hidden = false; $('#help').hidden = false; $('#no').hidden = false; $('#yes').hidden = false; $('#done').hidden = true;
  const rest = PALETTES.map((p, k) => k).filter(k => state.votes[PALETTES[k].id] === undefined);
  const back = rest[1];
  deck.innerHTML = (back !== undefined ? card(back, true) : '') + card(i, false);
  bindDrag(deck.querySelector('.sw:not(.is-back)'));
}
function card(i, back) {
  const p = PALETTES[i];
  return `<article class="sw${back ? ' is-back' : ''}" ${back ? 'aria-hidden="true"' : 'tabindex="0" aria-label="' + p.name + '"'} data-i="${i}">
    <header class="sw__head"><div><h2 class="sw__name">${p.name}</h2><p class="sw__idea">${p.idea}</p></div><span class="sw__n">${i + 1} / ${PALETTES.length}</span></header>
    ${mini(p, i)}
    <span class="stamp stamp--yes">Gefällt</span><span class="stamp stamp--no">Weg</span>
  </article>`;
}
function vote(v) {
  const i = next(); if (i < 0) return;
  const el = $('#deck .sw:not(.is-back)');
  state.votes[PALETTES[i].id] = v; state.history.push(PALETTES[i].id);
  persist();
  if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.style.transform = `translateX(${v > 0 ? 130 : -130}%) rotate(${v > 0 ? 18 : -18}deg)`; el.style.opacity = '0';
    setTimeout(render, 280);
  } else render();
}
function undo() {
  const id = state.history.pop(); if (!id) return;
  delete state.votes[id]; persist(); render();
}
function bindDrag(el) {
  if (!el) return;
  let x0 = null, y0 = 0, dx = 0, id = null;
  const yes = el.querySelector('.stamp--yes'), no = el.querySelector('.stamp--no');
  el.addEventListener('pointerdown', e => { if (e.button > 0) return; x0 = e.clientX; y0 = e.clientY; dx = 0; id = e.pointerId; });
  el.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!el.classList.contains('is-drag')) { if (Math.abs(dx) < 8 || Math.abs(dy) > Math.abs(dx)) return; el.classList.add('is-drag'); el.setPointerCapture(id); }
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 110)); no.style.opacity = Math.max(0, Math.min(1, -dx / 110));
  });
  const end = () => {
    if (x0 === null) return; x0 = null;
    if (!el.classList.contains('is-drag')) return;
    el.classList.remove('is-drag');
    const w = el.offsetWidth * 0.25;
    if (dx > w) vote(1); else if (dx < -w) vote(-1); else { el.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function renderDone() {
  const liked = PALETTES.filter(p => state.votes[p.id] === 1), gone = PALETTES.filter(p => state.votes[p.id] === -1);
  const d = $('#done'); d.hidden = false;
  d.innerHTML = `<h2>Gemerkt (${liked.length})</h2>
    ${liked.length ? `<p>Diese Farben haben dir gefallen. Sag mir im Chat, welche es werden soll; ich setze sie dann überall ein.</p>
      <div class="tiles">${liked.map(p => `<article class="tile">${mini(p, PALETTES.indexOf(p))}<p class="tile__name">${p.name}<small>${p.paper} · ${p.acc}</small></p></article>`).join('')}</div>`
      : '<p>Keine Farbe gemerkt. Starte noch einmal und wisch die, die dir gefallen, nach rechts.</p>'}
    ${gone.length ? `<h2>Verworfen (${gone.length})</h2><div class="chips">${gone.map(p => `<span class="chip"><i style="background:${p.paper}"></i>${p.name}</span>`).join('')}</div>` : ''}
    <button class="again" id="again" type="button">Noch einmal von vorn</button>`;
  $('#again').addEventListener('click', () => { state.votes = {}; state.history = []; persist(); render(); });
}

/* storage: shared store (Claude reads the result) with this browser as backup */
function loadLocal() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify({ votes: state.votes, history: state.history })); } catch (e) {} }
let writing = false, dirty = false;
async function persist() {
  saveLocal();
  if (!state.db || !state.uid) return;
  if (writing) { dirty = true; return; }
  writing = true;
  do {
    dirty = false;
    try { await state.db.doc('votes/' + state.uid).set({ votes: state.votes, history: state.history, updatedAt: new Date().toISOString() }); }
    catch (e) { note('Deine Wahl konnte gerade nicht gespeichert werden. Sie bleibt in diesem Browser und wird beim nächsten Wischen erneut gesendet.'); }
  } while (dirty);
  writing = false;
}
function note(t) { const n = $('#note'); n.textContent = t; n.hidden = !t; }
async function initStore() {
  const l = loadLocal(); state.votes = l.votes || {}; state.history = l.history || [];
  render();
  let user = null;
  try { user = await claude.use('user'); state.db = await claude.use('db'); } catch (e) {}
  if (user) state.uid = await user.id();
  if (state.db && state.uid) {
    try {
      const snap = await state.db.doc('votes/' + state.uid).get();
      if (snap.exists) { const d = snap.data() || {}; state.votes = { ...(d.votes || {}), ...state.votes }; state.history = state.history.length ? state.history : (d.history || []); }
    } catch (e) {}
    if (user && (await user.can('data.write')) === false) note('Du kannst die Seite gerade nur ansehen. Mit Mitmach-Rechten zählt deine Wahl.');
    persist();
  } else note('Deine Wahl wird nur in diesem Browser gespeichert. Sag mir am Ende einfach im Chat, welche Farbe es sein soll.');
  render();
}

$('#yes').addEventListener('click', () => vote(1));
$('#no').addEventListener('click', () => vote(-1));
$('#undo').addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') vote(1); else if (e.key === 'ArrowLeft') vote(-1);
  else if ((e.key === 'Backspace' || e.key === 'z') && state.history.length) undo();
});
