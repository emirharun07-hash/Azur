<title>Azur Design-Runde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@500;700&family=Libre+Bodoni:ital,wght@0,500;0,700;1,500&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one swipe card at a time (the design mock scaled into it), votes underneath; summary grid when a deck is done. */
:root {
  --bg: #ecebe7; --panel: #f7f6f3; --fg: #17181a; --muted: #67666a; --line: #d7d5cf;
  --accent: #1f5fbf; --no: #b4322d; --yes: #217a47; --star: #c48a00;
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-hand: 'Caveat', 'Comic Sans MS', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121315; --panel: #1b1c1f; --fg: #ecebe7; --muted: #9a99a0; --line: #2d2e33;
  --accent: #6fa8ff; --no: #ef6b63; --yes: #4cc27f; --star: #f2b832; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121315; --panel: #1b1c1f; --fg: #ecebe7; --muted: #9a99a0; --line: #2d2e33;
  --accent: #6fa8ff; --no: #ef6b63; --yes: #4cc27f; --star: #f2b832; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-display); font-stretch: 100%; }
.app { min-height: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; font-stretch: 70%; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.top h1 span { color: var(--muted); font-weight: 600; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tabs button { font: 600 13px/1 var(--f-display); padding: 9px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tabs button:focus-visible, .ctl button:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.who { font: 400 12px/1.5 var(--f-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.who b { color: var(--fg); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stage { position: relative; display: grid; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; touch-action: pan-y; user-select: none;
  box-shadow: 0 18px 40px rgb(0 0 0 / .12); transition: transform .32s cubic-bezier(.2,.7,.2,1), opacity .32s; will-change: transform; }
.card.dragging { transition: none; }
.card .view { position: relative; overflow: hidden; background: #000; cursor: grab; }
.card .view .scaler { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
.card .stamp { position: absolute; top: 18px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 8px; font: 800 26px/1 var(--f-display); font-stretch: 70%;
  text-transform: uppercase; letter-spacing: .06em; opacity: 0; transform: rotate(-10deg); pointer-events: none; background: rgb(255 255 255 / .85); z-index: 3; }
.card .stamp.yes { left: 18px; color: var(--yes); } .card .stamp.no { right: 18px; color: var(--no); transform: rotate(10deg); }
.card .stamp.star { left: 50%; translate: -50% 0; color: var(--star); transform: none; }
.meta { display: grid; gap: 6px; padding: 14px 16px 16px; }
.meta .id { font: 600 11px/1.5 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.meta h2 { margin: 0; font-size: 24px; font-weight: 800; font-stretch: 70%; text-transform: uppercase; text-wrap: balance; }
.meta p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 70ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font: 500 11px/1 var(--f-mono); padding: 6px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.ctl { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px; }
.ctl button { border: 2px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; cursor: pointer; display: grid; place-items: center; gap: 2px;
  font: 700 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.ctl .big { width: 74px; height: 74px; }
.ctl .big svg { width: 30px; height: 30px; }
.ctl .no { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, var(--line)); }
.ctl .yes { color: var(--yes); border-color: color-mix(in srgb, var(--yes) 45%, var(--line)); }
.ctl .star { color: var(--star); border-color: color-mix(in srgb, var(--star) 45%, var(--line)); width: 66px; height: 66px; }
.ctl .small { padding: 10px 14px; font-size: 11px; }
@media (min-width: 1000px) {
  .card { display: grid; grid-template-columns: auto 280px; }
  .card .meta { align-content: start; padding: 22px 20px; border-left: 1px solid var(--line); }
}
.ctl button:hover { background: var(--bg); }
.ctl button:disabled { opacity: .4; cursor: default; }
.hint { text-align: center; font: 400 11px/1.6 var(--f-mono); color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.done { display: grid; gap: 16px; }
.done h2 { margin: 0; font-size: 28px; font-weight: 800; font-stretch: 70%; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 0; color: var(--fg); font: inherit; }
.tile .view { position: relative; overflow: hidden; background: #000; }
.tile .view .scaler { transform-origin: 0 0; position: absolute; left: 0; top: 0; pointer-events: none; }
.tile .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 13px; }
.tile .row b { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.votes { display: flex; gap: 4px; flex-shrink: 0; }
.v { font: 600 10px/1 var(--f-mono); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); }
.v.yes { color: var(--yes); } .v.no { color: var(--no); } .v.star { color: var(--star); } .v.none { color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: 600 13px/1.4 var(--f-display); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.zoom { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .86); overflow: auto; display: grid; justify-items: center; align-content: start;
  padding: calc(56px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px)); }
.zoom .x { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: #111; font-size: 20px; cursor: pointer; }
.zoom .view { position: relative; overflow: hidden; border-radius: 8px; }
.zoom .scaler { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
@media (max-width: 560px) { .ctl { gap: 10px; } .ctl .big { width: 64px; height: 64px; } .meta h2 { font-size: 20px; } .tabs { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

/* ============ design mocks (fixed 1280 px canvas, scaled into the card) ============ */
.m { position: relative; width: 1280px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Archivo', Arial, sans-serif; font-stretch: 100%; font-size: 15px; line-height: 1.4; }
.m * { box-sizing: border-box; }
.m.pdp { height: 800px; } .m.shop { height: 1240px; }
.m h1, .m h2, .m h3 { margin: 0; font-weight: 800; font-stretch: 62%; text-transform: uppercase; letter-spacing: .005em; line-height: .9; }
.m h1 em, .m h2 em { font-style: normal; color: var(--acc); }
.m p { margin: 0; }
.m img { max-width: none; }
.m .eyebrow { font-family: 'Martian Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.m .lab { font-family: 'Martian Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.m .price { font-family: 'Martian Mono', monospace; font-size: 18px; font-weight: 600; }
.m .desc { color: var(--mut); font-size: 14px; line-height: 1.5; }
.m .hand { font-family: 'Caveat', cursive; color: var(--hand); font-weight: 700; }
.m .sz { display: flex; gap: 8px; }
.m .sz span { min-width: 48px; height: 42px; padding: 0 10px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: var(--r); font-weight: 700; font-size: 14px; background: var(--surf); color: var(--ink); }
.m .sz span.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.m .cta { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 56px; padding: 0 22px; background: var(--acc); color: var(--accInk);
  border-radius: var(--r); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .05em; font-stretch: 75%; }
.m .cta .cta-p { font-family: 'Martian Mono', monospace; font-size: 14px; letter-spacing: 0; font-stretch: 100%; }
.m .ship { font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; }
.m .ship::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2fae5c; flex: none; box-shadow: 0 0 0 3px rgb(47 174 92 / .2); }
.m .ship b { color: var(--ink); font-weight: 700; }
.m .trust { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--mut); list-style: none; padding: 0; margin: 0; }
.m .trust li::before { content: "✓"; color: var(--acc); margin-right: 5px; font-weight: 800; }
.m .guide { font-size: 12px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.m .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.m .fs { display: grid; gap: 7px; font-size: 12.5px; color: var(--mut); }
.m .fs b { color: var(--ink); }
.m .fs i { display: block; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.m .fs i s { display: block; height: 100%; background: var(--acc); }
.m .ups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.m .u { background: var(--surf2); border-radius: var(--r); padding: 8px; display: grid; gap: 4px; font-size: 11px; position: relative; }
.m .u img { width: 100%; height: 74px; object-fit: contain; }
.m .u b { font-weight: 700; font-size: 12px; }
.m .u .plus { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.m .bgroom { position: absolute; inset: -30px; background: url(img/room.webp) center/cover; filter: blur(16px) brightness(.42) saturate(.9); }
.m .shadow { filter: drop-shadow(0 30px 34px rgb(0 0 0 / .45)); }
.m .acc-list { display: grid; border-top: 1px solid var(--line); }
.m .acc-list div { display: flex; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.m .acc-list div::after { content: "+"; font-weight: 400; font-size: 18px; line-height: 1; }
.m .badge { display: inline-block; font-family: 'Martian Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: var(--r); background: var(--acc); color: var(--accInk); }

/* shop chrome */
.m .fromroom { height: 70px; background: linear-gradient(to bottom, rgb(0 0 0 / 0), var(--bg)), url(img/room.webp) center 92%/1280px auto; }
.m .mq { height: 32px; display: flex; align-items: center; gap: 22px; padding: 0 22px; background: var(--ink); color: var(--bg); white-space: nowrap; overflow: hidden;
  font-family: 'Martian Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.m .mq i { font-style: normal; color: var(--acc); }
.m .hd { height: 54px; display: flex; align-items: center; gap: 30px; padding: 0 40px; border-bottom: 1px solid var(--line); background: var(--bg); }
.m .hd .logo { height: 26px; width: auto; }
.m .hd nav { display: flex; gap: 22px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-stretch: 80%; }
.m .hd .hd-r { margin-left: auto; display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--mut); }
.m .hd .bag { color: var(--ink); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.m .hd .bag b { display: grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--acc); color: var(--accInk); font-size: 11px; }
.m .hd.center { justify-content: center; } .m .hd.center nav { position: absolute; left: 40px; } .m .hd.center .hd-r { position: absolute; right: 40px; }
.m .pc { display: grid; gap: 8px; position: relative; }
.m .pc .ph { position: relative; background: var(--surf2); border-radius: var(--r); display: grid; place-items: center; overflow: hidden; }
.m .pc .ph img { width: 78%; height: 86%; object-fit: contain; }
.m .pc .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 14px; }
.m .pc .nm span:last-child { font-family: 'Martian Mono', monospace; font-weight: 600; font-size: 13px; }
.m .pc .qa { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 40px; border-radius: var(--r); background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-stretch: 80%; }
.m .pc .new { position: absolute; top: 10px; left: 10px; }
.m .trustrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.m .trustrow div { padding: 18px 22px; display: grid; gap: 4px; font-size: 12.5px; color: var(--mut); border-right: 1px solid var(--line); }
.m .trustrow div:last-child { border-right: 0; }
.m .trustrow b { color: var(--ink); font-size: 14px; }
.m .signup { display: flex; align-items: center; gap: 24px; padding: 26px 40px; background: var(--surf2); }
.m .signup h3 { font-size: 34px; }
.m .signup .in { margin-left: auto; display: flex; gap: 0; }
.m .signup .in span { width: 300px; height: 48px; border: 1.5px solid var(--line); border-right: 0; background: var(--surf); display: flex; align-items: center; padding: 0 14px; color: var(--mut); font-size: 13px; border-radius: var(--r) 0 0 var(--r); }
.m .signup .in b { height: 48px; padding: 0 20px; display: flex; align-items: center; background: var(--acc); color: var(--accInk); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; border-radius: 0 var(--r) var(--r) 0; font-stretch: 80%; }
.m .chips { display: flex; gap: 8px; }
.m .chips span { padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 999px; font-weight: 700; font-size: 13px; }
.m .chips span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.m .btn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; background: var(--acc); color: var(--accInk); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; font-stretch: 80%; border-radius: var(--r); }
.m .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }

/* themes */
.t-paper { --bg: #f3f0ea; --surf: #fbfaf6; --surf2: #e9e4da; --ink: #16181b; --mut: #6d6a63; --line: #d6cfc2; --acc: #1f5fbf; --accInk: #ffffff; --r: 2px; --hand: #1f5fbf; }
.t-night { --bg: #0e1013; --surf: #161a1f; --surf2: #1d2229; --ink: #eef1f4; --mut: #8b939d; --line: #2a3039; --acc: #53d6ff; --accInk: #041219; --r: 10px; --hand: #53d6ff; }
.t-wood { --bg: #d9c3a3; --surf: #efe2cc; --surf2: #e2cfb2; --ink: #2b1e13; --mut: #6f5a44; --line: #bea27e; --acc: #23395d; --accInk: #f5ecdc; --r: 4px; --hand: #23395d; }
.t-flood { --bg: #0a1730; --surf: #0f2142; --surf2: #142a52; --ink: #f4f7fb; --mut: #9fb1cc; --line: #23406f; --acc: #ffd23f; --accInk: #0a1730; --r: 0px; --hand: #ffd23f; }
.t-flood h1, .t-flood h2, .t-flood h3 { font-stretch: 62%; font-weight: 900; }
.t-night h1, .t-night h2, .t-night h3 { font-weight: 700; }
.t-wood h1, .t-wood h2 { font-weight: 800; }
</style>

<div class="app" id="app">
  <div class="top">
    <h1>Azur Design-Runde <span id="roundLabel">1</span></h1>
    <div class="tabs" role="group" aria-label="Bereich">
      <button type="button" id="tab-pdp" aria-pressed="true">Produktansicht</button>
      <button type="button" id="tab-shop" aria-pressed="false">Shopseite</button>
      <button type="button" id="tab-result" aria-pressed="false">Ergebnis</button>
    </div>
  </div>
  <div class="who" id="who"><span>Stimmen werden geladen …</span></div>
  <div class="note" id="storeNote" hidden></div>
  <div class="bar" aria-hidden="true"><i id="progress" style="width:0"></i></div>
  <main id="main"></main>
</div>

<script>
/* ---------------------------------------------------------------- data */
const ROUND = 'r1';
const PRODUCTS = [
  { id: 'frankfurt', name: 'Frankfurt', code: '069', city: true, price: 64.99, img: 'img/frankfurt.webp',
    team: { bg: '#efe9da', surf: '#f8f4ea', surf2: '#e2dbc9', ink: '#0f2419', mut: '#4f6457', line: '#c9c1ac', acc: '#1d5c3a', accInk: '#f6f1e4', hand: '#a8832a', r: '3px' } },
  { id: 'berlin', name: 'Berlin', code: '030', city: true, price: 64.99, img: 'img/berlin.webp',
    team: { bg: '#121212', surf: '#1b1b1b', surf2: '#262523', ink: '#efe6d2', mut: '#a39d8f', line: '#38352f', acc: '#efe6d2', accInk: '#121212', hand: '#d8c79a', r: '2px' } },
  { id: 'brasilien', name: 'Brasilien', code: 'BRA', city: false, price: 54.99, img: 'img/brasilien.webp',
    team: { bg: '#ffd52e', surf: '#ffe47e', surf2: '#ffcb12', ink: '#0b3d1f', mut: '#2f5e3d', line: '#dfb000', acc: '#1f7a3a', accInk: '#fff2b3', hand: '#1d4ea8', r: '6px' } },
  { id: 'deutschland', name: 'Deutschland', code: 'GER', city: false, price: 54.99, img: 'img/deutschland.webp',
    team: { bg: '#f4f4f1', surf: '#ffffff', surf2: '#e8e8e4', ink: '#111111', mut: '#666666', line: '#d0d0cb', acc: '#111111', accInk: '#ffffff', hand: '#b5121b', r: '0px' } },
  { id: 'tuerkei', name: 'Türkei', code: 'TUR', city: false, price: 54.99, img: 'img/tuerkei.webp',
    team: { bg: '#c8141c', surf: '#d6252c', surf2: '#b10f17', ink: '#ffffff', mut: '#ffd9d9', line: '#e2575c', acc: '#ffffff', accInk: '#c8141c', hand: '#ffffff', r: '4px' } },
];
const THEMES = [
  { key: 'paper', name: 'Papier', dark: false, note: 'helles Papier wie im Zimmer, Azurblau als Akzent' },
  { key: 'night', name: 'Nacht', dark: true, note: 'dunkel wie das Zimmer nachts, Neon-Cyan vom Schild' },
  { key: 'team', name: 'Trikotfarben', dark: null, note: 'die Seite nimmt die Farben des Trikots an' },
  { key: 'wood', name: 'Holz & Kreide', dark: false, note: 'warm wie Schreibtisch und Kleiderstange, Marineblau' },
  { key: 'flood', name: 'Flutlicht', dark: true, note: 'Nachtblau und Flutlicht-Gelb, Stadion-Gefühl' },
];

const eur = v => v.toFixed(2).replace('.', ',') + ' €';
const title = p => p.city ? `${p.name} <em>${p.code}</em>` : `${p.name}`;
const desc = p => p.city ? `Polokragen, Azur-Signatur auf der Brust, die Vorwahl ${p.code} groß auf dem Rücken.` : `Retro-Schnitt, Azur-Signatur auf der Brust, in den Farben von ${p.name}.`;
const others = (p, n = 3) => PRODUCTS.filter(q => q.id !== p.id).slice(0, n);
const sizes = (sel = 'M') => `<div class="sz">${['S', 'M', 'L', 'XL'].map(s => `<span class="${s === sel ? 'on' : ''}">${s}</span>`).join('')}</div>`;
const cta = (p, label = 'In den Warenkorb') => `<div class="cta"><span>${label}</span><span class="cta-p">${eur(p.price)}</span></div>`;

/* 10 layouts x 5 themes, interleaved so neighbours differ in both */
function buildDeck(kind, layouts) {
  const out = [];
  for (let i = 0; i < 50; i++) {
    const L = layouts[i % 10], T = THEMES[(Math.floor(i / 10) + (i % 10)) % 5], P = PRODUCTS[(i * 3 + Math.floor(i / 10)) % 5];
    out.push({ id: `${kind === 'pdp' ? 'P' : 'S'}${String(i + 1).padStart(2, '0')}`, kind, L, T, P });
  }
  return out;
}
const DECKS = { pdp: buildDeck('pdp', PDP), shop: buildDeck('shop', SHOP) };
const ALL = [...DECKS.pdp, ...DECKS.shop];
const BY_ID = Object.fromEntries(ALL.map(c => [c.id, c]));

document.head.insertAdjacentHTML('beforeend', `<style>${[...PDP.map(l => l.css), ...SHOP.map(l => l.css)].join('\n')}</style>`);

function themeVars(c) {
  if (c.T.key !== 'team') return '';
  const t = c.P.team;
  return `--bg:${t.bg};--surf:${t.surf};--surf2:${t.surf2};--ink:${t.ink};--mut:${t.mut};--line:${t.line};--acc:${t.acc};--accInk:${t.accInk};--hand:${t.hand};--r:${t.r}`;
}
function isDark(c) {
  if (c.T.key !== 'team') return c.T.dark;
  const h = c.P.team.bg.slice(1), n = parseInt(h, 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 140;
}
function mockHTML(c) {
  const t = { dark: isDark(c) };
  return `<div class="m ${c.kind} t-${c.T.key === 'team' ? 'paper' : c.T.key} ${c.kind === 'pdp' ? 'L' : 'S'}-${c.L.key}" style="${themeVars(c)}">${c.L.html(c.P, t)}</div>`;
}
const MOCK_H = { pdp: 800, shop: 1240 };
function mountMock(view, c, width, maxH) {
  const s = Math.min(width / 1280, maxH ? maxH / MOCK_H[c.kind] : 9);
  view.style.width = Math.round(1280 * s) + 'px';
  view.style.height = Math.round(MOCK_H[c.kind] * s) + 'px';
  view.innerHTML = `<div class="scaler" style="transform:scale(${s})">${mockHTML(c)}</div>`;
}

/* ---------------------------------------------------------------- votes: db per person, localStorage fallback */
const VOTE = { '-1': 'Nein', '1': 'Ja', '2': 'Super' };
const state = { deck: 'pdp', mine: {}, all: {}, others: {}, uid: null, db: null, user: null, history: [], local: false };
const LKEY = 'azur-design-votes';
function loadLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch (e) { return {}; } }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(state.all)); } catch (e) { /* storage blocked */ } }
let writing = false, dirty = false;
async function persist() {
  state.all[ROUND] = state.mine;
  saveLocal();
  if (!state.db || !state.uid) return;
  if (writing) { dirty = true; return; }
  writing = true;
  do {
    dirty = false;
    try { await state.db.doc('votes/' + state.uid).set({ ...state.all, updatedAt: new Date().toISOString() }); }
    catch (e) { showNote('Deine Stimme konnte gerade nicht gespeichert werden (' + (e && e.code || 'Fehler') + '). Sie bleibt in diesem Browser und wird beim nächsten Klick erneut gesendet.'); }
  } while (dirty);
  writing = false;
}
function showNote(t) { const n = document.getElementById('storeNote'); n.textContent = t; n.hidden = !t; }

async function initStore() {
  state.all = loadLocal(); state.mine = { ...(state.all[ROUND] || {}) };
  try {
    state.user = await claude.use('user');
    state.db = await claude.use('db');
  } catch (e) { /* not in a viewer */ }
  if (state.user) state.uid = await state.user.id();
  if (state.db && state.uid) {
    try {
      const snap = await state.db.doc('votes/' + state.uid).get();
      if (snap.exists) {
        const d = snap.data();
        state.all = { ...d }; delete state.all.updatedAt;
        state.mine = { ...(state.all[ROUND] || {}), ...state.mine };
      }
    } catch (e) { /* first visit or transient */ }
    state.db.collection('votes').onSnapshot(s => {
      const o = {};
      s.docs.forEach(d => { if (d.id !== state.uid) o[d.id] = (d.data() || {})[ROUND] || {}; });
      state.others = o; renderWho(); if (state.view === 'done' || state.view === 'result') render();
    }, () => {});
    showNote('');
  } else {
    state.local = true;
    showNote('Deine Stimmen werden nur in diesem Browser gespeichert, weil die gemeinsame Ablage hier nicht verfügbar ist. Öffne die Seite angemeldet in Claude, damit Claude sie lesen kann.');
  }
  renderWho(); render();
}
async function renderWho() {
  const el = document.getElementById('who');
  const n = d => Object.keys(DECKS[d].reduce((a, c) => (state.mine[c.id] !== undefined && (a[c.id] = 1), a), {})).length;
  let txt = `<span>Du: <b>${n('pdp')}/50</b> Produktansicht · <b>${n('shop')}/50</b> Shopseite</span>`;
  const ids = Object.keys(state.others);
  if (ids.length && state.user) {
    const ps = await state.user.profiles(ids);
    ids.forEach(id => {
      const v = state.others[id], cnt = d => DECKS[d].filter(c => v[c.id] !== undefined).length;
      txt += `<span>${esc(ps[id] && ps[id].name || 'Partner')}: <b>${cnt('pdp')}/50</b> · <b>${cnt('shop')}/50</b></span>`;
    });
  } else txt += `<span>Partner: noch keine Stimmen</span>`;
  el.innerHTML = txt;
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------------------------------------------------------------- views */
const main = document.getElementById('main');
function nextIndex(deck) { const d = DECKS[deck]; const i = d.findIndex(c => state.mine[c.id] === undefined); return i; }
function setProgress() {
  const d = DECKS[state.deck] || DECKS.pdp, done = d.filter(c => state.mine[c.id] !== undefined).length;
  document.getElementById('progress').style.width = (done / d.length * 100) + '%';
}
function render() {
  ['pdp', 'shop', 'result'].forEach(k => document.getElementById('tab-' + k).setAttribute('aria-pressed', String(state.deck === k)));
  setProgress();
  if (state.deck === 'result') return renderResult();
  const i = nextIndex(state.deck);
  if (i < 0) return renderDone();
  renderCard(DECKS[state.deck][i], i);
}
function availW() { return Math.min(main.clientWidth || 900, 1120); }
function renderCard(c, i) {
  state.view = 'card';
  const d = DECKS[state.deck];
  main.innerHTML = `<div class="stage"><article class="card" id="card" aria-label="Entwurf ${c.id}">
      <span class="stamp yes">Ja</span><span class="stamp no">Nein</span><span class="stamp star">Super</span>
      <div class="view" id="cardView"></div>
      <div class="meta"><span class="id">${c.id} · ${i + 1} von ${d.length} · Stil: ${c.T.name}</span><h2>${c.L.name}</h2><p>${c.L.idea} <span style="color:var(--muted)">Farbwelt: ${c.T.note}.</span></p>
      <div class="tags">${c.L.tags.map(t => `<span>${t}</span>`).join('')}</div>
      <div><button type="button" class="link" id="zoomBtn">Groß ansehen</button></div></div></article></div>
    <div class="ctl"><button type="button" class="small" id="undo" ${state.history.length ? '' : 'disabled'}>Zurück</button>
      <button type="button" class="big no" id="vNo" aria-label="Nein"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 14V4M7 14l4.5 6.2c.7 1 2.2.6 2.3-.6l.4-4.6h4.6a2 2 0 0 0 2-2.3l-1-6A2 2 0 0 0 17.8 5H7"/></svg>Nein</button>
      <button type="button" class="star" id="vStar" aria-label="Super"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2.8l2.8 6 6.5.6-4.9 4.3 1.5 6.4L12 16.8 6.1 20.1l1.5-6.4L2.7 9.4l6.5-.6z"/></svg>Super</button>
      <button type="button" class="big yes" id="vYes" aria-label="Ja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 10v10M7 10l4.5-6.2c.7-1 2.2-.6 2.3.6l.4 4.6h4.6a2 2 0 0 1 2 2.3l-1 6A2 2 0 0 1 17.8 19H7"/></svg>Ja</button>
      <button type="button" class="small" id="skipDeck">${state.deck === 'pdp' ? 'Zur Shopseite' : 'Zur Produktansicht'}</button></div>
    <p class="hint">Wischen oder Tasten: ← Nein · ↑ Super · → Ja · Z zurück</p>`;
  const view = document.getElementById('cardView'), card = view.parentElement;
  const wide = matchMedia('(min-width: 1000px)').matches, top = card.getBoundingClientRect().top + scrollY;
  /* desktop: info column beside the mock, mock as tall as the window allows above the vote buttons */
  mountMock(view, c, availW() - 2 - (wide ? 280 : 0), wide ? Math.max(320, innerHeight - top - 140) : Math.max(260, innerHeight * .62));
  card.style.justifySelf = 'center';
  if (!wide) card.style.width = view.style.width;
  bindCard(c);
}
function vote(c, v) {
  const card = document.getElementById('card');
  state.mine[c.id] = v; state.history.push(c.id); persist(); renderWho();
  if (card && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    card.style.transform = v === 2 ? 'translateY(-120%) rotate(0)' : `translateX(${v > 0 ? 130 : -130}%) rotate(${v > 0 ? 14 : -14}deg)`;
    card.style.opacity = '0';
    setTimeout(render, 260);
  } else render();
}
function undo() {
  const id = state.history.pop(); if (!id) return;
  delete state.mine[id]; state.deck = BY_ID[id].kind; persist(); renderWho(); render();
}
function bindCard(c) {
  const card = document.getElementById('card');
  document.getElementById('vNo').onclick = () => vote(c, -1);
  document.getElementById('vYes').onclick = () => vote(c, 1);
  document.getElementById('vStar').onclick = () => vote(c, 2);
  document.getElementById('undo').onclick = undo;
  document.getElementById('zoomBtn').onclick = () => zoom(c);
  document.getElementById('skipDeck').onclick = () => { state.deck = state.deck === 'pdp' ? 'shop' : 'pdp'; render(); };
  let x0 = null, y0 = 0, dx = 0, dy = 0, id = null;
  const stamps = { yes: card.querySelector('.stamp.yes'), no: card.querySelector('.stamp.no'), star: card.querySelector('.stamp.star') };
  card.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; id = e.pointerId; });
  card.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (!card.classList.contains('dragging')) { card.classList.add('dragging'); try { card.setPointerCapture(id); } catch (err) { /* ignore */ } }
    card.style.transform = `translate(${dx}px, ${Math.min(0, dy)}px) rotate(${dx / 22}deg)`;
    stamps.yes.style.opacity = Math.max(0, Math.min(1, dx / 120));
    stamps.no.style.opacity = Math.max(0, Math.min(1, -dx / 120));
    stamps.star.style.opacity = Math.max(0, Math.min(1, -dy / 120 - Math.abs(dx) / 200));
  });
  const end = () => {
    if (x0 === null) return; x0 = null;
    if (!card.classList.contains('dragging')) return;
    card.classList.remove('dragging');
    if (dx > 120) vote(c, 1); else if (dx < -120) vote(c, -1); else if (dy < -120) vote(c, 2);
    else { card.style.transform = ''; Object.values(stamps).forEach(s => (s.style.opacity = 0)); }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e => {
  if (document.querySelector('.zoom')) { if (e.key === 'Escape') document.querySelector('.zoom').remove(); return; }
  if (state.view !== 'card' || e.target.closest('input,textarea')) return;
  const c = DECKS[state.deck][nextIndex(state.deck)]; if (!c) return;
  if (e.key === 'ArrowLeft') vote(c, -1); else if (e.key === 'ArrowRight') vote(c, 1); else if (e.key === 'ArrowUp') { e.preventDefault(); vote(c, 2); } else if (e.key.toLowerCase() === 'z') undo();
});
function zoom(c) {
  const z = document.createElement('div'); z.className = 'zoom'; z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', 'Entwurf groß');
  z.innerHTML = `<button type="button" class="x" aria-label="Schließen">✕</button><div class="view"></div>`;
  document.body.appendChild(z);
  mountMock(z.querySelector('.view'), c, Math.min(window.innerWidth - 24, 1280));
  z.querySelector('.x').onclick = () => z.remove();
  z.addEventListener('click', e => { if (e.target === z) z.remove(); });
}
function voteChip(v, who) {
  if (v === undefined) return `<span class="v none">${who} –</span>`;
  return `<span class="v ${v === 2 ? 'star' : v > 0 ? 'yes' : 'no'}">${who} ${v === 2 ? '★' : v > 0 ? 'Ja' : 'Nein'}</span>`;
}
function tiles(list) {
  return list.map(c => {
    const ov = Object.values(state.others).map(o => voteChip(o[c.id], 'P')).join('');
    return `<button type="button" class="tile" data-id="${c.id}"><div class="view"></div><div class="row"><b>${c.id} · ${c.L.name} · ${c.T.name}</b><span class="votes">${voteChip(state.mine[c.id], 'Du')}${ov}</span></div></button>`;
  }).join('');
}
function mountTiles() {
  main.querySelectorAll('.tile').forEach(t => {
    const c = BY_ID[t.dataset.id]; const w = t.clientWidth || 220;
    mountMock(t.querySelector('.view'), c, w, w * 0.62);
    t.onclick = () => zoom(c);
  });
}
function renderDone() {
  state.view = 'done';
  const d = DECKS[state.deck], liked = d.filter(c => state.mine[c.id] > 0).length, stars = d.filter(c => state.mine[c.id] === 2).length;
  const other = state.deck === 'pdp' ? 'shop' : 'pdp', rest = nextIndex(other) >= 0;
  main.innerHTML = `<section class="done"><h2>${state.deck === 'pdp' ? 'Produktansicht' : 'Shopseite'}: fertig</h2>
    <p>Du hast ${liked} Entwürfe gemocht, davon ${stars} mit Stern. ${rest ? '' : 'Beide Bereiche sind durch.'} Claude liest eure Stimmen aus und baut daraus Runde 2.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">${rest ? `<button type="button" class="link" id="goOther">Weiter mit ${other === 'pdp' ? 'der Produktansicht' : 'der Shopseite'}</button>` : ''}<button type="button" class="link" id="goRes">Ergebnis ansehen</button></div>
    <div class="grid">${tiles(d.filter(c => state.mine[c.id] > 0))}</div></section>`;
  if (rest) document.getElementById('goOther').onclick = () => { state.deck = other; render(); };
  document.getElementById('goRes').onclick = () => { state.deck = 'result'; render(); };
  mountTiles();
}
function score(c) {
  const vs = [state.mine[c.id], ...Object.values(state.others).map(o => o[c.id])].filter(v => v !== undefined);
  return vs.reduce((a, v) => a + (v === 2 ? 3 : v), 0);
}
function renderResult() {
  state.view = 'result';
  const sect = (kind, label) => {
    const list = DECKS[kind].filter(c => state.mine[c.id] !== undefined || Object.values(state.others).some(o => o[c.id] !== undefined))
      .sort((a, b) => score(b) - score(a)).slice(0, 12);
    return `<h2>${label}: eure Favoriten</h2>${list.length ? `<div class="grid">${tiles(list)}</div>` : '<p class="hint" style="text-align:left">Noch keine Stimmen.</p>'}`;
  };
  main.innerHTML = `<section class="done"><p>Punkte: Stern 3, Ja 1, Nein −1, von euch beiden zusammengezählt. Tippe auf eine Kachel, um sie groß zu sehen.</p>${sect('pdp', 'Produktansicht')}${sect('shop', 'Shopseite')}</section>`;
  mountTiles();
}
['pdp', 'shop', 'result'].forEach(k => (document.getElementById('tab-' + k).onclick = () => { state.deck = k; render(); }));
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(render, 150); });
render();
if (window.claude && claude.use) initStore(); else { state.local = true; showNote('Deine Stimmen werden nur in diesem Browser gespeichert.'); renderWho(); }
</script>
